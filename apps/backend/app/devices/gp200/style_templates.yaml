styles:
  grunge:
    keywords: [grunge, nirvana, alternative, dirty, 90s]
    signal_chain: [PRE, WAH, DST, AMP, NR, CAB, EQ, MOD, DLY, RVB, VOL]
    gain_level: medium_high
    eq_character: low_mid_forward
    modulation_choice: chorus
    delay_reverb_choice: room_reverb
    noise_reduction_recommendation: light
    modules:
      PRE: { enabled: true, effect: pre_comp, parameters: { sustain: 36, volume: 54 } }
      WAH: { enabled: false, effect: wah_v_wah, parameters: { range: 48, q: 32, volume: 50 } }
      DST: { enabled: true, effect: dst_revolt, parameters: { gain: 58, tone: 48, volume: 56, mode: 50 } }
      AMP: { enabled: true, effect: amp_uk_800, parameters: { gain: 58, presence: 50, volume: 60, bass: 56, middle: 60, treble: 48 } }
      NR: { enabled: true, effect: nr_gate_2, parameters: { threshold: 32, attack: 45, release: 48 } }
      CAB: { enabled: true, effect: cab_uk_ld, parameters: { volume: 50, low_cut: 75, hi_cut: 76 } }
      EQ: { enabled: true, effect: eq_guitar_eq_1, parameters: { band_1: 54, band_2: 52, band_3: 58, band_4: 46, band_5: 48, volume: 50 } }
      MOD: { enabled: true, effect: mod_a_chorus, parameters: { depth: 32, rate: 28, tone: 50, sync: 0 } }
      DLY: { enabled: false, effect: dly_analog_delay, parameters: { mix: 10, feedback: 16, time: 36, sync: 0, trail: 0 } }
      RVB: { enabled: true, effect: rvb_room, parameters: { mix: 14, pre_delay: 20, decay: 30, trail: 0 } }
      VOL: { enabled: true, effect: vol_volume, parameters: { volume: 100 } }
  metal:
