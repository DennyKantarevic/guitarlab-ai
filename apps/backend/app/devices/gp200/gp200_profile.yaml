# Small project seed profile for Valeton GP-200.
# This is not the complete official GP-200 effect list. Replace or expand these
# manually as verified GP-200 effect names and parameter maps are collected.
device: Valeton
model: GP-200
module_order:
  - PRE
  - WAH
  - DST
  - AMP
  - NR
  - CAB
  - EQ
  - MOD
  - DLY
  - RVB
  - VOL
modules:
  PRE:
    label: Pre effect
    effects:
      compressor:
        label: Compressor
        parameters:
          sustain: { min: 0, max: 100, default: 42 }
          attack: { min: 0, max: 100, default: 48 }
          level: { min: 0, max: 100, default: 55 }
  WAH:
    label: Wah
    effects:
      auto_wah:
        label: Auto Wah
        parameters:
          sensitivity: { min: 0, max: 100, default: 52 }
          depth: { min: 0, max: 100, default: 48 }
  DST:
    label: Drive
    effects:
      overdrive:
        label: Overdrive
        parameters:
          gain: { min: 0, max: 100, default: 18 }
          tone: { min: 0, max: 100, default: 55 }
          level: { min: 0, max: 100, default: 58 }
      distortion:
        label: Distortion
        parameters:
          gain: { min: 0, max: 100, default: 52 }
          tone: { min: 0, max: 100, default: 54 }
          level: { min: 0, max: 100, default: 56 }
      fuzz:
        label: Fuzz
        parameters:
          gain: { min: 0, max: 100, default: 62 }
          tone: { min: 0, max: 100, default: 45 }
          level: { min: 0, max: 100, default: 56 }
  AMP:
    label: Amp
    effects:
      clean_amp:
        label: Clean Amp
        parameters:
          gain: { min: 0, max: 100, default: 24 }
          bass: { min: 0, max: 100, default: 50 }
          mid: { min: 0, max: 100, default: 48 }
          treble: { min: 0, max: 100, default: 60 }
          master: { min: 0, max: 100, default: 64 }
      driven_amp:
        label: Driven Amp
        parameters:
          gain: { min: 0, max: 100, default: 48 }
          bass: { min: 0, max: 100, default: 52 }
          mid: { min: 0, max: 100, default: 58 }
          treble: { min: 0, max: 100, default: 54 }
          master: { min: 0, max: 100, default: 60 }
      high_gain_amp:
        label: High Gain Amp
        parameters:
          gain: { min: 0, max: 100, default: 72 }
          bass: { min: 0, max: 100, default: 52 }
          mid: { min: 0, max: 100, default: 38 }
          treble: { min: 0, max: 100, default: 62 }
          master: { min: 0, max: 100, default: 62 }
  NR:
    label: Noise reduction
    effects:
      noise_gate:
        label: Noise Gate
        parameters:
          threshold: { min: 0, max: 100, default: 38 }
          release: { min: 0, max: 100, default: 45 }
  CAB:
    label: Cab
    effects:
      matched_cab:
        label: Matched Cab
        parameters:
          mic_position: { min: 0, max: 100, default: 52 }
          low_cut_hz: { min: 20, max: 250, default: 80 }
          high_cut_hz: { min: 3000, max: 12000, default: 7500 }
  EQ:
    label: EQ
    effects:
      parametric_eq:
        label: Parametric EQ
        parameters:
          low_gain: { min: 0, max: 100, default: 50 }
          mid_freq: { min: 100, max: 5000, default: 800 }
          mid_gain: { min: 0, max: 100, default: 50 }
          high_gain: { min: 0, max: 100, default: 50 }
          level: { min: 0, max: 100, default: 50 }
  MOD:
    label: Modulation
    effects:
      chorus:
        label: Chorus
        parameters:
          rate: { min: 0, max: 100, default: 32 }
          depth: { min: 0, max: 100, default: 38 }
          mix: { min: 0, max: 100, default: 24 }
      phaser:
        label: Phaser
        parameters:
          rate: { min: 0, max: 100, default: 42 }
          depth: { min: 0, max: 100, default: 35 }
          mix: { min: 0, max: 100, default: 22 }
  DLY:
    label: Delay
    effects:
      analog_delay:
        label: Analog Delay
        parameters:
          time_ms: { min: 1, max: 2000, default: 420 }
          feedback: { min: 0, max: 100, default: 28 }
          mix: { min: 0, max: 100, default: 20 }
      digital_delay:
        label: Digital Delay
        parameters:
          time_ms: { min: 1, max: 2000, default: 380 }
          feedback: { min: 0, max: 100, default: 22 }
          mix: { min: 0, max: 100, default: 16 }
  RVB:
    label: Reverb
    effects:
      room_reverb:
        label: Room Reverb
        parameters:
          decay: { min: 0, max: 100, default: 26 }
          tone: { min: 0, max: 100, default: 50 }
          mix: { min: 0, max: 100, default: 12 }
      plate_reverb:
        label: Plate Reverb
        parameters:
          decay: { min: 0, max: 100, default: 42 }
          tone: { min: 0, max: 100, default: 56 }
          mix: { min: 0, max: 100, default: 20 }
  VOL:
    label: Volume
    effects:
      volume:
        label: Volume
        parameters:
          level: { min: 0, max: 100, default: 100 }
