# Effect metadata:
# - verified: false means this is a seed/internal effect name.
# - verified: true means the effect was manually checked against a source.
# - source may be seed_profile, manual, editor_export, user_verified, or unknown.
# - official_effect_name is optional and should only be filled when manually verified.
